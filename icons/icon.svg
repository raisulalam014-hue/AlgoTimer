<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circular badge -->
  <circle cx="64" cy="64" r="58" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Top Crown Button -->
  <rect x="52" y="4" width="24" height="10" rx="3" fill="#38bdf8" />
  <rect x="58" y="14" width="12" height="6" fill="#0284c7" />

  <!-- Side Lap/Reset Buttons -->
  <rect x="18" y="24" width="10" height="6" rx="2" transform="rotate(-35 23 27)" fill="#64748b" />
  <rect x="100" y="24" width="10" height="6" rx="2" transform="rotate(35 105 27)" fill="#64748b" />

  <!-- Glowing Progress Track -->
  <circle cx="64" cy="66" r="44" fill="none" stroke="#1e293b" stroke-width="8" />
  <circle cx="64" cy="66" r="44" fill="none" stroke="url(#cyanGrad)" stroke-width="8" 
          stroke-dasharray="276" stroke-dashoffset="60" stroke-linecap="round" filter="url(#glow)" />

  <!-- Tick Marks -->
  <line x1="64" y1="30" x2="64" y2="35" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="97" x2="64" y2="102" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="66" x2="33" y2="66" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="95" y1="66" x2="100" y2="66" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Clock Hands -->
  <!-- Minute hand (pointing to 2 o'clock) -->
  <line x1="64" y1="66" x2="88" y2="48" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
  <!-- Second hand (pointing to 6 o'clock) -->
  <line x1="64" y1="66" x2="64" y2="90" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

  <!-- Center Pivot Dot -->
  <circle cx="64" cy="66" r="7" fill="#f43f5e" />
  <circle cx="64" cy="66" r="3" fill="#ffffff" />
</svg>
