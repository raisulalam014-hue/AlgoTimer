<!DOCTYPE html>
<html lang="en" data-theme="black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoTimer - Floating Stopwatch</title>
  <style>
    /* ==========================================================================
       AlgoTimer — Premium Black Minimalist Floating Stopwatch
       Apple Watch Aesthetics x Modern Fintech Dashboard
       Pitch Black (#080808) & Dark Charcoal Surfaces with Vibrant Accents
       ========================================================================== */

    :root {
      --bg-main: #080808;
      --bg-secondary: #101010;
      --bg-card: #171717;
      --bg-card-elevated: #202020;
      --bg-pill: rgba(16, 16, 16, 0.96);
      --border-subtle: #303030;
      --border-focus: #484848;

      --text-primary: #FFFFFF;
      --text-secondary: #A5A5A5;
      --text-muted: #707070;

      --accent-blue: #287BFF;
      --accent-green: #49C98B;
      --accent-orange: #FF4B24;
      --accent-yellow: #FFD329;
      --accent-purple: #995BFF;

      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Plus Jakarta Sans", "Inter", "Segoe UI", Roboto, sans-serif;

      --morph-duration: 200ms;
      --morph-easing: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-main);
      font-family: var(--font-sans);
      color: var(--text-primary);
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #float-widget {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-main);
    }

    /* ==========================================================================
       MODE A: MINI TIMER PILL (NUMBER ONLY)
       Compact rounded black pill with accent milliseconds
       ========================================================================== */
    #mini-pill-view {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      box-sizing: border-box;
      cursor: pointer;
      background: transparent;
      opacity: 0;
      transform: scale(0.96);
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--morph-duration) var(--morph-easing), 
                  transform var(--morph-duration) var(--morph-easing),
                  visibility var(--morph-duration);
      z-index: 10;
    }

    .mini-pill-inner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 9px 20px;
      border-radius: 9999px;
      background: var(--bg-pill);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      transition: transform 0.16s var(--morph-easing), border-color 0.2s ease, box-shadow 0.2s ease;
      max-width: 95%;
    }

    #mini-pill-view:hover .mini-pill-inner {
      transform: translateY(-1px) scale(1.02);
      border-color: var(--border-focus);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.85);
    }

    /* Living Timer subtle glow on Pill when running */
    .mini-pill-inner.is-running {
      border-color: rgba(73, 201, 139, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 16px rgba(73, 201, 139, 0.2);
    }

    .mini-pill-inner.is-paused {
      border-color: rgba(255, 211, 41, 0.35);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), 0 0 12px rgba(255, 211, 41, 0.15);
    }

    .mini-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--text-muted);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .mini-status-dot.running {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulseDot 1.6s infinite ease-in-out;
    }

    .mini-status-dot.paused {
      background: var(--accent-yellow);
      box-shadow: 0 0 6px var(--accent-yellow);
      animation: none;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .mini-timer-digits {
      font-family: var(--font-mono);
      font-size: clamp(18px, 6vw, 24px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      line-height: 1;
      white-space: nowrap;
    }

    .mini-timer-digits small {
      font-size: 0.75em;
      color: var(--accent-blue);
      margin-left: 2px;
    }

    /* ==========================================================================
       MODE B: NORMAL FLOATING WIDGET (Apple Watch + Fintech Card)
       Suggested Dimensions: ~300px x ~235px
       ========================================================================== */
    #normal-widget-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.96);
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--morph-duration) var(--morph-easing),
                  transform var(--morph-duration) var(--morph-easing),
                  visibility var(--morph-duration);
      z-index: 5;
    }

    /* Minimalist Header */
    .float-header {
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      gap: 6px;
      transition: opacity var(--morph-duration) var(--morph-easing),
                  transform var(--morph-duration) var(--morph-easing);
      transform: translateY(-8px);
      opacity: 0;
    }

    .float-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .float-icon {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-blue);
      flex-shrink: 0;
    }

    .float-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .float-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 140ms var(--morph-easing);
    }

    .float-btn:hover {
      background: var(--bg-card-elevated);
      border-color: var(--border-focus);
      color: #FFFFFF;
    }

    .float-btn:active {
      transform: scale(0.95);
    }

    .float-btn.active {
      background: var(--bg-card-elevated);
      border-color: var(--accent-blue);
      color: #FFFFFF;
    }

    /* Minimize to Mini Pill Button */
    .float-btn-minimize {
      background: var(--bg-card-elevated);
      color: #FFFFFF;
    }

    /* Normal Body Layout */
    .float-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 10px;
      gap: 6px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .float-tag {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 2px 10px;
      border-radius: 12px;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      transition: opacity var(--morph-duration) var(--morph-easing),
                  transform var(--morph-duration) var(--morph-easing);
      transform: translateY(-4px);
      opacity: 0;
    }

    /* Timer Hero Section */
    .float-timer-hero {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      position: relative;
    }

    /* Subtle Living Glow */
    .hero-glow-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 170px;
      height: 85px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(40, 123, 255, 0.18) 0%, transparent 70%);
      filter: blur(14px);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .float-timer-hero.is-running .hero-glow-halo {
      opacity: 1;
    }

    .float-timer-hero.is-paused .hero-glow-halo {
      opacity: 0.4;
      background: radial-gradient(ellipse at center, rgba(255, 211, 41, 0.15) 0%, transparent 70%);
    }

    .float-status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      margin-bottom: 2px;
      position: relative;
      z-index: 1;
    }

    .status-pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background-color 0.2s ease;
    }

    .status-pulse-dot.running {
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    .status-pulse-dot.paused {
      background: var(--accent-yellow);
      box-shadow: 0 0 6px var(--accent-yellow);
    }

    .float-mode-badge {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .float-clock {
      position: relative;
      z-index: 1;
      font-family: var(--font-mono);
      font-size: clamp(24px, 7vh, 34px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
      color: #FFFFFF;
      line-height: 1.1;
      white-space: nowrap;
    }

    .float-clock small {
      font-size: 0.72em;
      color: var(--accent-blue);
      margin-left: 2px;
    }

    .float-clock.warning {
      color: var(--accent-orange);
    }

    /* Dual Clocks View */
    .float-dual-box {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 6px 10px;
    }

    .float-dual-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .float-dual-label {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .float-dual-digits {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #FFFFFF;
    }

    .float-dual-digits.warning {
      color: var(--accent-orange);
    }

    /* ==========================================================================
       ACTION CONTROLS ROW — Apple Watch Squircle Buttons
       ========================================================================== */
    .float-controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 2px;
      transition: opacity var(--morph-duration) var(--morph-easing),
                  transform var(--morph-duration) var(--morph-easing);
      transform: translateY(8px);
      opacity: 0;
    }

    .float-ctrl-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 12px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 140ms var(--morph-easing);
      user-select: none;
    }

    .float-ctrl-btn:hover {
      background: var(--bg-card-elevated);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }

    .float-ctrl-btn:active {
      transform: scale(0.95);
    }

    #btn-reset:active {
      transform: scale(0.95) rotate(-15deg);
    }

    .float-ctrl-primary {
      flex: 1.4;
      background: var(--accent-blue);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(40, 123, 255, 0.35);
      position: relative;
      overflow: hidden;
      transition: background 160ms var(--morph-easing),
                  box-shadow 160ms var(--morph-easing),
                  transform 140ms var(--morph-easing);
    }

    .float-ctrl-primary:hover {
      background: #3c8aff;
      box-shadow: 0 6px 20px rgba(40, 123, 255, 0.5);
    }

    .float-ctrl-primary:active {
      transform: scale(0.96);
    }

    .float-ctrl-primary.running {
      background: var(--accent-orange);
      box-shadow: 0 4px 16px rgba(255, 75, 36, 0.45);
    }

    .float-ctrl-primary.running:hover {
      background: #ff6140;
    }

    .btn-icon-wrap {
      position: relative;
      width: 12px;
      height: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-icon-wrap svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transition: opacity 160ms var(--morph-easing),
                  transform 160ms var(--morph-easing);
    }

    .float-ctrl-primary:not(.running) .icon-play {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .float-ctrl-primary:not(.running) .icon-pause {
      opacity: 0;
      transform: scale(0.6) rotate(-90deg);
    }

    .float-ctrl-primary.running .icon-play {
      opacity: 0;
      transform: scale(0.6) rotate(90deg);
    }

    .float-ctrl-primary.running .icon-pause {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    /* Shortcut Keycaps */
    kbd.float-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 15px;
      padding: 0 3px;
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 800;
      color: var(--text-muted);
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
    }

    .float-ctrl-primary kbd.float-key {
      color: #FFFFFF;
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Sub-Gauges (LAPS, SPLIT, STATUS) */
    .float-sub-gauges {
      display: flex;
      gap: 6px;
      margin-top: 2px;
      flex-shrink: 0;
      transition: opacity var(--morph-duration) var(--morph-easing),
                  transform var(--morph-duration) var(--morph-easing);
      transform: translateY(6px);
      opacity: 0;
    }

    .float-sub-gauge {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 3px 8px;
      min-width: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .float-sub-val {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .float-sub-lbl {
      font-size: 7px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    /* ==========================================================================
       MODE C: OPTIONAL EXPANDED MODE (Height >= 320px)
       ========================================================================== */
    .float-expanded-laps {
      display: none;
      width: 100%;
      flex: 1;
      min-height: 90px;
      max-height: 180px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 8px 10px;
      margin-top: 4px;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .expanded-laps-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .lap-count-pill {
      background: var(--accent-blue);
      color: #FFFFFF;
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 10px;
      font-family: var(--font-mono);
    }

    .expanded-laps-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
    }

    .expanded-lap-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      padding: 4px 8px;
      background: var(--bg-secondary);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .expanded-lap-num { color: var(--accent-blue); font-weight: 700; }
    .expanded-lap-split { color: var(--text-secondary); }
    .expanded-lap-total { color: #FFFFFF; font-weight: 700; }

    .expanded-lap-empty {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      padding: 12px 0;
    }

    .expanded-lap-row.new-lap {
      animation: lapSlideIn 200ms var(--morph-easing) forwards;
    }

    @keyframes lapSlideIn {
      0% {
        opacity: 0;
        transform: translateY(-6px) scale(0.98);
        background: rgba(40, 123, 255, 0.25);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        background: var(--bg-secondary);
      }
    }

    /* ==========================================================================
       MAGIC MORPH VIEW SWITCHES
       ========================================================================== */
    body.mode-mini #mini-pill-view {
      opacity: 1;
      transform: scale(1);
      visibility: visible;
      pointer-events: auto;
    }

    body.mode-mini #normal-widget-view {
      opacity: 0;
      transform: scale(0.96);
      visibility: hidden;
      pointer-events: none;
    }

    body.mode-normal #mini-pill-view {
      opacity: 0;
      transform: scale(0.96);
      visibility: hidden;
      pointer-events: none;
    }

    body.mode-normal #normal-widget-view {
      opacity: 1;
      transform: scale(1);
      visibility: visible;
      pointer-events: auto;
    }

    body.mode-normal .float-header,
    body.mode-normal .float-tag,
    body.mode-normal .float-controls,
    body.mode-normal .float-sub-gauges {
      opacity: 1;
      transform: translateY(0);
    }

    /* When expanded (height >= 320px), show laps list */
    body.mode-normal.is-expanded .float-expanded-laps {
      display: flex;
    }

    body.mode-normal.is-expanded .float-sub-gauges {
      display: none;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body class="mode-normal">
  <div id="float-widget">

    <!-- ================= MODE A: MINI TIMER PILL ================= -->
    <div id="mini-pill-view" class="mini-pill-card" title="Click to expand floating stopwatch">
      <div class="mini-pill-inner" id="mini-pill-inner">
        <span class="mini-status-dot" id="mini-status-dot"></span>
        <span class="mini-timer-digits" id="mini-timer-digits">00:00:00<small id="mini-timer-millis">.00</small></span>
      </div>
    </div>

    <!-- ================= MODE B & C: NORMAL / EXPANDED WIDGET ================= -->
    <div id="normal-widget-view">
      <!-- Minimalist Header -->
      <div class="float-header">
        <div class="float-title">
          <span class="float-icon"></span>
          <span>AlgoTimer</span>
        </div>
        <div class="float-actions">
          <!-- Minimize to Mini Pill Button -->
          <button class="float-btn float-btn-minimize" id="btn-minimize-to-mini" title="Minimize to Mini Timer Pill">
            🗕 <span class="btn-lbl">Mini</span>
          </button>

          <!-- Always on Top PiP -->
          <button class="float-btn" id="btn-pip-always-ontop" title="Always on Top (Floats over all apps)">
            📌 <span class="btn-lbl" id="btn-pip-text">Pin</span>
          </button>

          <!-- Corner cycler -->
          <button class="float-btn" id="btn-corner-cycle" title="Dock to Screen Corners (TR, BR, BL, TL)">
            ↗ <span id="corner-label">TR</span>
          </button>
        </div>
      </div>

      <!-- Body -->
      <div class="float-body">
        <div class="float-tag" id="float-problem-title">Problem Solving Session</div>

        <!-- Timer Hero (With Subtle Living Glow) -->
        <div class="float-timer-hero" id="float-timer-hero">
          <div class="hero-glow-halo" aria-hidden="true"></div>

          <div class="float-status-indicator">
            <span class="status-pulse-dot" id="normal-status-dot"></span>
            <span class="float-mode-badge" id="float-mode-badge">STOPWATCH</span>
          </div>

          <div class="float-clock" id="float-clock-single">
            00:00:00<small id="float-millis">.00</small>
          </div>

          <!-- Dual Clocks View -->
          <div class="float-dual-box" id="float-clock-dual" style="display: none;">
            <div class="float-dual-row">
              <span class="float-dual-label">⏱️ Elapsed</span>
              <span class="float-dual-digits" id="float-dual-sw">00:00:00</span>
            </div>
            <div class="float-dual-row">
              <span class="float-dual-label">⏳ Target</span>
              <span class="float-dual-digits" id="float-dual-timer">30:00:00</span>
            </div>
          </div>
        </div>

        <!-- Apple Watch Style Squircle Controls -->
        <div class="float-controls">
          <button class="float-ctrl-btn float-ctrl-primary" id="btn-play">
            <span class="btn-icon-wrap" aria-hidden="true">
              <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6 4 20 12 6 20 6 4"></polygon>
              </svg>
              <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
                <rect x="5" y="4" width="4" height="16" rx="1"></rect>
                <rect x="15" y="4" width="4" height="16" rx="1"></rect>
              </svg>
            </span>
            <span id="btn-play-text">Start</span>
            <kbd class="float-key">Space</kbd>
          </button>
          <button class="float-ctrl-btn" id="btn-lap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
              <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
              <line x1="4" y1="22" x2="4" y2="15"></line>
            </svg>
            <span>Lap</span>
            <kbd class="float-key">L</kbd>
          </button>
          <button class="float-ctrl-btn" id="btn-reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span>Reset</span>
            <kbd class="float-key">R</kbd>
          </button>
        </div>

        <!-- Sub-Gauges (Normal Mode) -->
        <div class="float-sub-gauges" id="float-sub-gauges">
          <div class="float-sub-gauge" title="Total Laps">
            <span class="float-sub-val" id="float-sub-laps">0</span>
            <span class="float-sub-lbl">LAPS</span>
          </div>
          <div class="float-sub-gauge" title="Current Split">
            <span class="float-sub-val" id="float-sub-split">00:00</span>
            <span class="float-sub-lbl">SPLIT</span>
          </div>
          <div class="float-sub-gauge" title="Timer Status">
            <span class="float-sub-val" id="float-sub-state">READY</span>
            <span class="float-sub-lbl">STATUS</span>
          </div>
        </div>

        <!-- Expanded Mode Laps History (Visible only when window is tall >= 320px) -->
        <div class="float-expanded-laps" id="float-expanded-laps">
          <div class="expanded-laps-header">
            <span>Recent Laps</span>
            <span id="expanded-lap-count" class="lap-count-pill">0</span>
          </div>
          <div class="expanded-laps-list" id="expanded-laps-list">
            <div class="expanded-lap-empty">No laps recorded yet. Press L to record split.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup/audio.js"></script>
  <script src="float.js"></script>
</body>
</html>
