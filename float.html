<!DOCTYPE html>
<html lang="en" data-theme="sunset">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoTimer - Persistent Floating Timer</title>
  <style>
    /* ==========================================================================
       AlgoTimer - Dynamic Cyber-Luxury Floating Screen
       Obsidian Backdrop | Violet Nebula Glow | Electric Cyan & Magenta Accents
       ========================================================================== */

    :root,
    [data-theme="cosmic"] {
      --bg-deep: #060713;
      --bg-nebula: radial-gradient(circle at 50% 25%, rgba(124, 58, 237, 0.35) 0%, rgba(6, 182, 212, 0.14) 42%, rgba(6, 7, 19, 0.98) 82%);
      --bg-surface: rgba(16, 19, 38, 0.85);
      --bg-surface-elevated: rgba(24, 28, 56, 0.82);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(0, 242, 254, 0.45);

      --accent-cyan: #00f2fe;
      --accent-purple: #8b5cf6;
      --accent-magenta: #ec4899;
      --accent-lavender: #c084fc;

      --hero-btn: linear-gradient(135deg, #7c3aed 0%, #6366f1 50%, #00f2fe 100%);
      --hero-shadow: 0 4px 18px rgba(124, 58, 237, 0.55), 0 0 14px rgba(0, 242, 254, 0.35);

      --kbd-border: rgba(0, 242, 254, 0.5);
      --kbd-color: #00f2fe;

      --horizon-start: #ec4899;
      --horizon-mid: #8b5cf6;
      --horizon-end: #00f2fe;
      --horizon-shadow: 0 -2px 14px 2px rgba(0, 242, 254, 0.7), 0 -4px 28px 6px rgba(139, 92, 246, 0.5);

      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .pin-control[aria-pressed="true"] {
      color: var(--accent-cyan);
      background: color-mix(in srgb, var(--accent-cyan) 9%, white);
      border-color: var(--border-active);
    }

    [data-theme="cyan"] {
      --bg-deep: #040914;
      --bg-nebula: radial-gradient(circle at 50% 25%, rgba(2, 132, 199, 0.35) 0%, rgba(0, 242, 254, 0.16) 45%, rgba(4, 9, 20, 0.98) 82%);
      --bg-surface: rgba(10, 24, 42, 0.88);
      --bg-surface-elevated: rgba(14, 34, 58, 0.85);
      --border-active: rgba(0, 242, 254, 0.6);
      --accent-cyan: #00f2fe;
      --accent-purple: #0284c7;
      --accent-magenta: #f59e0b;
      --accent-lavender: #7dd3fc;
      --hero-btn: linear-gradient(135deg, #0284c7 0%, #00f2fe 100%);
      --hero-shadow: 0 4px 18px rgba(2, 132, 199, 0.55), 0 0 16px rgba(0, 242, 254, 0.45);
      --kbd-border: rgba(0, 242, 254, 0.65);
      --kbd-color: #00f2fe;
      --horizon-start: #f59e0b;
      --horizon-mid: #0284c7;
      --horizon-end: #00f2fe;
      --horizon-shadow: 0 -2px 14px 2px rgba(0, 242, 254, 0.7), 0 -4px 26px 5px rgba(2, 132, 199, 0.45);
    }

    [data-theme="violet"] {
      --bg-deep: #080616;
      --bg-nebula: radial-gradient(circle at 50% 25%, rgba(139, 92, 246, 0.4) 0%, rgba(192, 132, 252, 0.15) 45%, rgba(8, 6, 22, 0.98) 82%);
      --bg-surface: rgba(22, 16, 44, 0.88);
      --bg-surface-elevated: rgba(32, 24, 62, 0.85);
      --border-active: rgba(192, 132, 252, 0.6);
      --accent-cyan: #c084fc;
      --accent-purple: #a855f7;
      --accent-magenta: #ec4899;
      --accent-lavender: #f0abfc;
      --hero-btn: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%);
      --hero-shadow: 0 4px 18px rgba(124, 58, 237, 0.55), 0 0 16px rgba(192, 132, 252, 0.45);
      --kbd-border: rgba(192, 132, 252, 0.6);
      --kbd-color: #f0abfc;
      --horizon-start: #ec4899;
      --horizon-mid: #a855f7;
      --horizon-end: #c084fc;
      --horizon-shadow: 0 -2px 14px 2px rgba(192, 132, 252, 0.7), 0 -4px 28px 6px rgba(168, 85, 247, 0.5);
    }

    [data-theme="emerald"] {
      --bg-deep: #040e0b;
      --bg-nebula: radial-gradient(circle at 50% 25%, rgba(16, 185, 129, 0.35) 0%, rgba(52, 211, 153, 0.15) 45%, rgba(4, 14, 11, 0.98) 82%);
      --bg-surface: rgba(10, 30, 24, 0.88);
      --bg-surface-elevated: rgba(16, 44, 34, 0.85);
      --border-active: rgba(52, 211, 153, 0.6);
      --accent-cyan: #34d399;
      --accent-purple: #10b981;
      --accent-magenta: #06b6d4;
      --accent-lavender: #a7f3d0;
      --hero-btn: linear-gradient(135deg, #059669 0%, #34d399 100%);
      --hero-shadow: 0 4px 18px rgba(5, 150, 105, 0.55), 0 0 16px rgba(52, 211, 153, 0.45);
      --kbd-border: rgba(52, 211, 153, 0.6);
      --kbd-color: #6ee7b7;
      --horizon-start: #10b981;
      --horizon-mid: #34d399;
      --horizon-end: #6ee7b7;
      --horizon-shadow: 0 -2px 14px 2px rgba(52, 211, 153, 0.7), 0 -4px 28px 6px rgba(16, 185, 129, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-deep);
      background-image: var(--bg-nebula);
      background-attachment: fixed;
      font-family: var(--font-sans);
      color: var(--text-primary);
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #float-widget {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Bottom Horizon Flare */
    .horizon-flare {
      position: absolute;
      bottom: 0;
      left: 8%;
      right: 8%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--horizon-start) 20%, var(--horizon-mid) 50%, var(--horizon-end) 80%, transparent 100%);
      box-shadow: var(--horizon-shadow);
      border-radius: 50%;
      pointer-events: none;
      z-index: 20;
    }

    /* Header */
    .float-header {
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: rgba(16, 19, 38, 0.75);
      border-bottom: 1px solid var(--border-subtle);
      gap: 6px;
    }

    .float-title {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    .float-icon {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
      box-shadow: 0 0 8px var(--accent-cyan);
      flex-shrink: 0;
    }

    .float-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .float-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .float-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-active);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .float-btn.active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.4) 0%, rgba(6, 182, 212, 0.3) 100%);
      border-color: var(--accent-cyan);
      color: #ffffff;
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
    }

    /* Main Body */
    .float-body {
      flex: 1;
      min-height: 0; /* Critical for child flex scaling! */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px 10px;
      gap: 4px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .float-tag {
      font-size: 9px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 2px 8px;
      border-radius: 12px;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    /* Single View & Dial Area */
    #float-single-view {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .float-dial-wrapper {
      position: relative;
      width: min(150px, 36vh, 55vw);
      height: min(150px, 36vh, 55vw);
      max-width: 160px;
      max-height: 160px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 1;
    }

    .float-dial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .float-dial-ticks {
      stroke: rgba(255, 255, 255, 0.15);
    }

    .float-dial-track {
      stroke: rgba(255, 255, 255, 0.06);
    }

    .float-dial-progress {
      stroke-dasharray: 439.82;
      stroke-dashoffset: 439.82;
      transition: stroke-dashoffset 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .float-dial-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .float-mode-badge {
      font-size: 8px;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 7px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .float-clock {
      font-family: var(--font-mono);
      font-size: clamp(20px, 6vh, 26px);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(0, 242, 254, 0.35);
      line-height: 1.1;
    }

    .float-clock small {
      font-size: clamp(12px, 3.5vh, 15px);
      color: var(--accent-cyan);
      margin-left: 2px;
    }

    .float-clock.warning {
      color: #f43f5e;
      text-shadow: 0 0 16px rgba(244, 63, 94, 0.6);
    }

    /* Sub-Gauges (LAPS, SPLIT, STATUS) */
    .float-sub-gauges {
      display: flex;
      gap: 5px;
      margin-top: 2px;
    }

    .float-sub-gauge {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px 4px;
      min-width: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .float-sub-val {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .float-sub-lbl {
      font-size: 6px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--text-muted);
    }

    /* Dual Clocks View */
    .float-dual-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 6px 10px;
    }

    .float-dual-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .float-dual-label {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
    }

    .float-dual-digits {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .float-dual-digits.warning {
      color: #f43f5e;
    }

    /* Controls Row */
    .float-controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 2px;
    }

    .float-ctrl-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .float-ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-active);
      transform: translateY(-1px);
    }

    .float-ctrl-primary {
      flex: 1.4;
      background: var(--hero-btn);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 12px;
      box-shadow: var(--hero-shadow);
      font-size: 12px;
      font-weight: 800;
    }

    .float-ctrl-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(124, 58, 237, 0.7), 0 0 16px rgba(0, 242, 254, 0.5);
    }

    .float-ctrl-primary.running {
      background: linear-gradient(135deg, #e11d48 0%, #f43f5e 100%);
      box-shadow: 0 4px 20px rgba(225, 29, 72, 0.6);
    }

    /* Shortcut Keycaps */
    kbd.float-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 15px;
      padding: 0 3px;
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 800;
      color: var(--kbd-color);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--kbd-border);
      border-radius: 4px;
      box-shadow: 0 0 6px rgba(0, 242, 254, 0.25);
    }

    .float-ctrl-primary kbd.float-key {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.25);
    }

    /* ================= RESPONSIVE ADAPTATIONS ================= */
    /* COMPACT MODE (Height < 330px or Width < 290px) */
    @media (max-height: 330px), (max-width: 290px) {
      .float-tag,
      .float-sub-gauges,
      .btn-lbl {
        display: none !important;
      }
      .float-dial-wrapper {
        width: min(105px, 34vh);
        height: min(105px, 34vh);
      }
      .float-clock {
        font-size: 19px;
      }
      .float-clock small {
        font-size: 12px;
      }
      .float-body {
        padding: 4px 8px 6px;
        gap: 3px;
      }
      .float-ctrl-btn {
        padding: 4px 8px;
        font-size: 10px;
      }
      .float-ctrl-primary {
        padding: 5px 12px;
        font-size: 11px;
      }
    }

    /* MINI / MICRO MODE (Height < 210px) */
    @media (max-height: 210px) {
      .float-tag,
      .float-sub-gauges,
      .float-dial-svg,
      .btn-lbl {
        display: none !important;
      }
      .float-dial-wrapper {
        width: 100%;
        height: auto;
        margin: 0;
      }
      .float-clock {
        font-size: 21px;
      }
      .float-clock small {
        font-size: 13px;
      }
      .float-body {
        padding: 2px 8px 4px;
        justify-content: center;
        gap: 4px;
      }
      .float-controls {
        margin-top: 0;
      }
      .float-ctrl-btn {
        padding: 3px 6px;
        font-size: 9px;
      }
    }
    .float-position-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(8, 10, 22, 0.72);
      color: var(--text-secondary);
      font-size: 10px;
    }
    .float-position-row select {
      min-width: 98px;
      padding: 4px 6px;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      background: #101326;
      color: var(--text-primary);
      font: inherit;
    }
    #float-position-note {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 9px;
      text-align: right;
    }
    .float-mini-view {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: #080a12;
      border: 1px solid var(--border-active);
      border-radius: 12px;
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.14);
    }
    .mini-clock {
      color: #fff;
      font-family: var(--font-mono);
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 0 14px rgba(0, 242, 254, 0.35);
    }
    .mini-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }
    #float-mini-dot { width: 6px; height: 6px; border-radius: 50%; background: #64748b; }
    body[data-view-mode="mini"] #float-mini-view { display: flex; }
    body[data-view-mode="mini"] .float-header,
    body[data-view-mode="mini"] .float-position-row,
    body[data-view-mode="mini"] .float-body,
    body[data-view-mode="mini"] .horizon-flare { display: none !important; }
    body[data-view-mode="mini"] #float-widget { padding: 5px; }
    @media (max-width: 360px) {
      .float-position-row { gap: 4px; padding: 4px 6px; }
      #float-position-note { max-width: 120px; }
      .float-btn { padding: 3px 4px; }
    }

    :root,
    [data-theme="sunset"] {
      color-scheme: dark;
      --bg-deep: #17131b;
      --bg-nebula: none;
      --bg-surface: #241b26;
      --bg-surface-elevated: #2e222e;
      --border-subtle: #48313f;
      --border-active: #fb795f;
      --accent-cyan: #fb795f;
      --accent-purple: #fb795f;
      --accent-magenta: #e85c83;
      --accent-lavender: #c084fc;
      --hero-btn: #fb795f;
      --hero-text: #241313;
      --hero-shadow: 0 4px 11px rgba(251, 121, 95, 0.22);
      --kbd-border: #fb795f;
      --kbd-color: #fb795f;
      --alert-text: #ffd6dc;
      --alert-bg: #3a1c24;
      --alert-border: #70404b;
      --text-primary: #f9edf0;
      --text-secondary: #c8a9b5;
      --text-muted: #9e8290;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="warm"] {
      color-scheme: light;
      --bg-deep: #f4f0e9;
      --bg-surface: #fffdf9;
      --bg-surface-elevated: #f7f1e9;
      --border-subtle: #e8ded3;
      --border-active: #b84d1c;
      --accent-cyan: #b84d1c;
      --accent-purple: #b84d1c;
      --accent-magenta: #c65337;
      --accent-lavender: #f97316;
      --hero-btn: #b84d1c;
      --hero-text: #ffffff;
      --hero-shadow: 0 4px 11px rgba(232, 104, 37, 0.2);
      --kbd-border: #b84d1c;
      --kbd-color: #b84d1c;
      --alert-text: #8f2938;
      --alert-bg: #fff0f1;
      --alert-border: #f3c9ce;
      --text-primary: #3e332a;
      --text-secondary: #706253;
      --text-muted: #706253;
    }

    [data-theme="aurora"] {
      color-scheme: light;
      --bg-deep: #eef0fb;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f6f6ff;
      --border-subtle: #dce0f2;
      --border-active: #aaa5ed;
      --accent-cyan: #6758d8;
      --accent-purple: #6758d8;
      --accent-magenta: #e55c7c;
      --accent-lavender: #8b5cf6;
      --hero-btn: #6758d8;
      --hero-text: #ffffff;
      --hero-shadow: 0 4px 11px rgba(103, 88, 216, 0.2);
      --kbd-border: #6758d8;
      --kbd-color: #6758d8;
      --alert-text: #8f2938;
      --alert-bg: #fff0f1;
      --alert-border: #f3c9ce;
      --text-primary: #24294e;
      --text-secondary: #626a88;
      --text-muted: #626a88;
    }

    [data-theme="graphite"] {
      color-scheme: dark;
      --bg-deep: #19181e;
      --bg-surface: #24232b;
      --bg-surface-elevated: #2d2b35;
      --border-subtle: #393741;
      --border-active: #b59aff;
      --accent-cyan: #c0a3ff;
      --accent-purple: #9d7de8;
      --accent-magenta: #f2c65d;
      --accent-lavender: #c0a3ff;
      --hero-btn: #8b6ee8;
      --hero-text: #17121f;
      --hero-shadow: 0 4px 11px rgba(139, 110, 232, 0.25);
      --kbd-border: #c0a3ff;
      --kbd-color: #c0a3ff;
      --alert-text: #ffd6dc;
      --alert-bg: #3a1c24;
      --alert-border: #70404b;
      --text-primary: #f0eef6;
      --text-secondary: #b8b3c5;
      --text-muted: #8b8798;
    }

    [data-theme="black"] {
      color-scheme: dark;
      --bg-deep: #000000;
      --bg-surface: #080808;
      --bg-surface-elevated: #111111;
      --border-subtle: #292929;
      --border-active: #f5cc55;
      --accent-cyan: #f5cc55;
      --accent-purple: #d7ae3e;
      --accent-magenta: #8eeaff;
      --accent-lavender: #c4a8ff;
      --hero-btn: #f5cc55;
      --hero-text: #17140b;
      --hero-shadow: 0 4px 14px rgba(245, 204, 85, 0.24);
      --kbd-border: #f5cc55;
      --kbd-color: #f5cc55;
      --alert-text: #ffb4be;
      --alert-bg: #2b1115;
      --alert-border: #6a2931;
      --text-primary: #f5f5f5;
      --text-secondary: #c8c8c8;
      --text-muted: #a5a5a5;
    }

    [data-theme="minimal"] {
      color-scheme: dark;
      --bg-deep: #0b0e12;
      --bg-surface: #12171d;
      --bg-surface-elevated: #1b222b;
      --border-subtle: #29323d;
      --border-active: #65a9ff;
      --accent-cyan: #65a9ff;
      --accent-purple: #458fe8;
      --accent-magenta: #8fc4ff;
      --accent-lavender: #b5d7ff;
      --hero-btn: #65a9ff;
      --hero-text: #071626;
      --hero-shadow: none;
      --kbd-border: #426c98;
      --kbd-color: #9dcaff;
      --alert-text: #ffd6dc;
      --alert-bg: #3a1c24;
      --alert-border: #70404b;
      --text-primary: #edf2f8;
      --text-secondary: #a4afbd;
      --text-muted: #8592a1;
    }

    [data-theme="dashboard"] {
      color-scheme: dark;
      --bg-deep: #10191f;
      --bg-surface: #18252e;
      --bg-surface-elevated: #20313b;
      --border-subtle: #30414c;
      --border-active: #54cbbd;
      --accent-cyan: #54cbbd;
      --accent-purple: #35aa9d;
      --accent-magenta: #8ce2d8;
      --accent-lavender: #b0f0e9;
      --hero-btn: #54cbbd;
      --hero-text: #082522;
      --hero-shadow: none;
      --kbd-border: #397f78;
      --kbd-color: #82e2d7;
      --alert-text: #ffd6dc;
      --alert-bg: #3a1c24;
      --alert-border: #70404b;
      --text-primary: #e8f1f5;
      --text-secondary: #aec0ca;
      --text-muted: #8fa4af;
    }

    [data-theme="purple"] {
      color-scheme: dark;
      --bg-deep: #100d1c;
      --bg-surface: #1c1730;
      --bg-surface-elevated: #29223e;
      --border-subtle: #3a3150;
      --border-active: #b8a0ff;
      --accent-cyan: #b8a0ff;
      --accent-purple: #9c81ed;
      --accent-magenta: #d3a9ff;
      --accent-lavender: #e0cfff;
      --hero-btn: #b8a0ff;
      --hero-text: #201738;
      --hero-shadow: none;
      --kbd-border: #706099;
      --kbd-color: #d0c0ff;
      --alert-text: #ffd6dc;
      --alert-bg: #3a1c24;
      --alert-border: #70404b;
      --text-primary: #f3effc;
      --text-secondary: #bbb2cf;
      --text-muted: #968daa;
    }

    [data-theme="glass"] {
      color-scheme: light;
      --bg-deep: #edf1f8;
      --bg-surface: #fbfcff;
      --bg-surface-elevated: #f6f7fc;
      --border-subtle: #d7deea;
      --border-active: #a74668;
      --accent-cyan: #a74668;
      --accent-purple: #893751;
      --accent-magenta: #b553a0;
      --accent-lavender: #7960c6;
      --hero-btn: #a74668;
      --hero-text: #ffffff;
      --hero-shadow: none;
      --kbd-border: #c98ca1;
      --kbd-color: #873b57;
      --alert-text: #8f2938;
      --alert-bg: #fff0f1;
      --alert-border: #f3c9ce;
      --text-primary: #293247;
      --text-secondary: #5d677d;
      --text-muted: #5d677d;
    }

    [data-theme="navy"] {
      color-scheme: dark;
      --bg-deep: #071421;
      --bg-surface: #0e2232;
      --bg-surface-elevated: #173044;
      --border-subtle: #244254;
      --border-active: #43d1e4;
      --accent-cyan: #43d1e4;
      --accent-purple: #2ab5ca;
      --accent-magenta: #ed78ad;
      --accent-lavender: #b1f0f3;
      --hero-btn: #43d1e4;
      --hero-text: #06242a;
      --hero-shadow: none;
      --kbd-border: #347e8a;
      --kbd-color: #8ce8ef;
      --alert-text: #ffd6dc;
      --alert-bg: #3a1c24;
      --alert-border: #70404b;
      --text-primary: #edf7fb;
      --text-secondary: #a7c0cf;
      --text-muted: #8ca7b7;
    }

    body {
      background-color: var(--bg-deep);
      background-image: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    .horizon-flare { display: none; }

    .float-header {
      background: var(--bg-surface);
      border-bottom-color: var(--border-subtle);
    }

    .float-title { color: var(--accent-cyan); }

    .float-icon {
      background: var(--accent-cyan);
      box-shadow: none;
    }

    .float-btn {
      color: var(--text-secondary);
      background: var(--bg-surface);
      border-color: var(--border-subtle);
      border-radius: 7px;
    }

    .float-btn:hover {
      color: var(--accent-cyan);
      background: var(--bg-surface-elevated);
      border-color: var(--border-active);
      transform: none;
    }

    .float-btn.active {
      color: var(--accent-cyan);
      background: color-mix(in srgb, var(--accent-cyan) 16%, var(--bg-surface));
      border-color: var(--border-active);
      box-shadow: none;
    }

    .pin-control[aria-pressed="true"] {
      color: var(--accent-cyan);
      background: color-mix(in srgb, var(--accent-cyan) 16%, var(--bg-surface));
      border-color: var(--border-active);
    }

    .float-body { padding: 8px 14px 12px; }

    .float-tag {
      color: var(--text-secondary);
      background: var(--bg-surface-elevated);
      border-color: var(--border-subtle);
    }

    .float-dial-ticks { stroke: var(--border-subtle); }
    .float-dial-track { stroke: var(--bg-surface-elevated); }

    .float-mode-badge {
      color: var(--accent-cyan);
      background: var(--bg-surface-elevated);
      border-color: var(--border-subtle);
    }

    .float-clock {
      color: var(--text-primary);
      text-shadow: none;
      font-variant-numeric: tabular-nums;
    }

    .float-clock small { color: var(--text-secondary); }

    .float-sub-gauge {
      background: var(--bg-surface-elevated);
      border-color: var(--border-subtle);
    }

    .float-sub-val { color: var(--text-primary); }

    .float-dual-box {
      background: var(--bg-surface);
      border-color: var(--border-subtle);
    }

    .float-dual-label { color: var(--text-secondary); }

    .float-dual-digits {
      color: var(--text-primary);
      text-shadow: none;
      font-variant-numeric: tabular-nums;
    }

    .float-ctrl-btn {
      color: var(--text-secondary);
      background: var(--bg-surface);
      border-color: var(--border-subtle);
      border-radius: 9px;
    }

    .float-ctrl-btn:hover {
      color: var(--accent-cyan);
      background: var(--bg-surface-elevated);
      border-color: var(--border-active);
      transform: none;
    }

    .float-ctrl-primary,
    .float-ctrl-primary.running {
      color: var(--hero-text);
      background: var(--hero-btn);
      border-color: var(--hero-btn);
      box-shadow: var(--hero-shadow);
    }

    .float-ctrl-primary:hover {
      color: var(--hero-text);
      background: color-mix(in srgb, var(--hero-btn) 88%, black);
      box-shadow: var(--hero-shadow);
    }

    .float-position-row {
      color: var(--text-secondary);
      background: var(--bg-surface);
      border-bottom-color: var(--border-subtle);
    }

    .float-position-row select {
      color: var(--text-primary);
      background: var(--bg-surface-elevated);
      border-color: var(--border-subtle);
    }

    #float-position-note { color: var(--text-secondary); }

    .float-mini-view {
      color: var(--text-primary);
      background: var(--bg-surface);
      border-color: var(--border-subtle);
      border-radius: 14px;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--bg-deep) 35%, transparent);
    }

    .mini-clock {
      color: var(--text-primary);
      text-shadow: none;
      font-variant-numeric: tabular-nums;
    }

    .mini-status { color: var(--text-secondary); }

    .runtime-alert {
      padding: 8px 12px;
      color: var(--alert-text);
      background: var(--alert-bg);
      border-bottom: 1px solid var(--alert-border);
      font: 11px/1.45 var(--font-sans);
    }

    .runtime-alert[hidden] { display: none; }

    html, body {
      background-image: none;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .float-header {
      background: var(--bg-surface);
    }

    .horizon-flare {
      display: none;
    }

    .float-icon {
      background: var(--accent-cyan);
      box-shadow: none;
    }

    .float-btn,
    .float-ctrl-btn {
      min-height: 32px;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .float-btn:hover,
    .float-ctrl-btn:hover {
      transform: none;
    }

    .float-dial-ticks {
      display: none;
    }

    .float-sub-gauges {
      display: flex;
      gap: 20px;
      margin-top: 6px;
    }

    .float-sub-gauge {
      padding: 0;
      background: transparent;
      border: 0;
    }

    .float-sub-gauge:last-child {
      display: none;
    }

    .float-dial-progress {
      stroke: var(--accent-cyan);
      filter: none;
    }

    .float-clock {
      background: none;
      color: var(--text-primary);
      text-shadow: none;
      font-family: Consolas, "Courier New", monospace;
      font-variant-numeric: tabular-nums;
      -webkit-text-fill-color: currentColor;
      filter: none;
    }

    .float-clock.warning,
    .float-clock.paused {
      animation: none;
      filter: none;
      text-shadow: none;
    }

    .float-ctrl-primary,
    .float-ctrl-primary.running,
    .float-ctrl-primary:hover {
      box-shadow: none;
    }

    .float-position-row,
    .float-body {
      background: var(--bg-deep);
    }

    html[data-theme="glass"] .float-tag,
    html[data-theme="glass"] .float-dual-box,
    html[data-theme="glass"] .float-mini-view {
      background: rgba(251, 252, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    html[data-theme="navy"] .float-mode-badge,
    html[data-theme="navy"] .float-dual-row:nth-child(2) .float-dual-label {
      color: var(--accent-magenta);
    }

    .float-btn:focus-visible,
    .float-ctrl-btn:focus-visible,
    .float-position-row select:focus-visible,
    .pin-control:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body data-size="normal" data-view-mode="expanded">
  <div id="float-widget">
    <div class="runtime-alert" id="float-runtime-error" role="alert" hidden></div>
    <div id="float-mini-view" class="float-mini-view" role="button" tabindex="0" aria-label="Expand AlgoTimer">
      <span class="mini-clock" id="float-mini-clock">00:00</span>
      <span class="mini-status"><span id="float-mini-dot" aria-hidden="true"></span><span id="float-mini-status">READY</span></span>
    </div>
    <!-- Ambient Horizon Light Flare -->
    <div class="horizon-flare" aria-hidden="true"></div>

    <!-- Header -->
    <div class="float-header">
      <div class="float-title"><span class="float-icon"></span><span>AlgoTimer</span></div>
      <div class="float-actions">
        <button class="float-btn" id="btn-float-theme" title="Cycle through 10 coordinated timer themes">Theme <span class="btn-lbl" id="float-theme-label">Sunset Glass</span></button>
        <button class="float-btn" id="btn-pip-always-ontop" title="Open browser-managed picture-in-picture; the browser controls its position">PiP <span class="btn-lbl" id="btn-pip-text">Topmost</span></button>
        <button class="float-btn" id="btn-size-cycle" title="Minimize to mini timer"><span id="size-label">Mini</span></button>
        <button class="float-btn" id="btn-close-float" title="Close floating timer" aria-label="Close floating timer">x</button>
      </div>
    </div>
    <div class="float-position-row" id="float-position-row">
      <label for="float-corner-select">Position</label>
      <select id="float-corner-select" aria-label="Floating timer corner">
        <option value="top-left">Top left</option>
        <option value="top-right">Top right</option>
        <option value="bottom-left">Bottom left</option>
        <option value="bottom-right">Bottom right</option>
      </select>
      <button class="float-btn pin-control" id="btn-pin-corner" aria-pressed="false" aria-keyshortcuts="P" title="Pin the timer to the selected screen corner; press P while this window is focused">Pin to corner</button>
      <span id="float-position-note">Unpinned | drag the header to move. Pinning anchors this window, not above other apps. Press P when focused.</span>
    </div>

    <!-- Body -->
    <div class="float-body">
      <div class="float-tag" id="float-problem-title">Problem Solving Session</div>

      <!-- Single Clock Dial View (Stopwatch or Target Timer) -->
      <div id="float-single-view">
        <div class="float-dial-wrapper">
          <svg class="float-dial-svg" viewBox="0 0 160 160">
            <defs>
              <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f2fe" id="grad-stop-1" />
                <stop offset="50%" stop-color="#8b5cf6" id="grad-stop-2" />
                <stop offset="100%" stop-color="#ec4899" id="grad-stop-3" />
              </linearGradient>
              <filter id="timerGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <!-- Outer Precision Ticks -->
            <circle class="float-dial-ticks" cx="80" cy="80" r="74" stroke="rgba(255, 255, 255, 0.16)" stroke-dasharray="2 5" stroke-width="2" fill="none" />
            <!-- Base Track -->
            <circle class="float-dial-track" cx="80" cy="80" r="70" stroke="rgba(255, 255, 255, 0.06)" stroke-width="6" fill="none"></circle>
            <!-- Active Progress Arc -->
            <circle class="float-dial-progress" id="float-dial-progress" cx="80" cy="80" r="70" stroke="url(#timerGrad)" filter="url(#timerGlow)" stroke-width="6" stroke-linecap="round" fill="none"></circle>
          </svg>

          <div class="float-dial-content">
            <div class="float-mode-badge" id="float-mode-badge">STOPWATCH</div>
            <div class="float-clock" id="float-clock-single">00:00<small id="float-millis">.0</small></div>

            <!-- 3 Mini Sub-Indicators -->
            <div class="float-sub-gauges">
              <div class="float-sub-gauge" title="Total Laps">
                <span class="float-sub-val" id="float-sub-laps">0</span>
                <span class="float-sub-lbl">LAPS</span>
              </div>
              <div class="float-sub-gauge" title="Current Split">
                <span class="float-sub-val" id="float-sub-split">00:00</span>
                <span class="float-sub-lbl">SPLIT</span>
              </div>
              <div class="float-sub-gauge" title="Timer Status">
                <span class="float-sub-val" id="float-sub-state">READY</span>
                <span class="float-sub-lbl">STATUS</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Dual Clocks View (Both Active) -->
      <div class="float-dual-box" id="float-clock-dual" style="display: none;">
        <div class="float-dual-row">
          <span class="float-dual-label">Elapsed</span>
          <span class="float-dual-digits" id="float-dual-sw">00:00:00</span>
        </div>
        <div class="float-dual-row">
          <span class="float-dual-label">Target</span>
          <span class="float-dual-digits" id="float-dual-timer">30:00:00</span>
        </div>
      </div>

      <!-- Controls with Shortcut Keycaps -->
      <div class="float-controls">
        <button class="float-ctrl-btn float-ctrl-primary" id="btn-play">
          <span id="btn-play-text">Start</span> <kbd class="float-key">Space</kbd>
        </button>
        <button class="float-ctrl-btn" id="btn-lap">
          Lap <kbd class="float-key">L</kbd>
        </button>
        <button class="float-ctrl-btn" id="btn-reset">
          Reset <kbd class="float-key">R</kbd>
        </button>
      </div>
    </div>
  </div>

  <script src="popup/audio.js"></script>
  <script src="float.js"></script>
</body>
</html>
