<!DOCTYPE html>
<html lang="en" data-theme="cosmic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoTimer - Always-on-Top Floating HUD</title>
  <style>
    /* ==========================================================================
       AlgoTimer - Dynamic Cyber-Luxury Floating Screen
       Obsidian Backdrop | Violet Nebula Glow | Electric Cyan & Magenta Accents
       ========================================================================== */

    :root,
    [data-theme="cosmic"] {
      --bg-deep: #060713;
      --bg-nebula: radial-gradient(circle at 50% 25%, rgba(124, 58, 237, 0.35) 0%, rgba(6, 182, 212, 0.14) 42%, rgba(6, 7, 19, 0.98) 82%);
      --bg-surface: rgba(16, 19, 38, 0.82);
      --bg-surface-elevated: rgba(24, 28, 56, 0.8);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(0, 242, 254, 0.45);

      --accent-cyan: #00f2fe;
      --accent-purple: #8b5cf6;
      --accent-magenta: #ec4899;
      --accent-lavender: #c084fc;

      --hero-btn: linear-gradient(135deg, #7c3aed 0%, #6366f1 50%, #00f2fe 100%);
      --hero-shadow: 0 4px 20px rgba(124, 58, 237, 0.55), 0 0 14px rgba(0, 242, 254, 0.35);

      --kbd-border: rgba(0, 242, 254, 0.5);
      --kbd-color: #00f2fe;

      --horizon-start: #ec4899;
      --horizon-mid: #8b5cf6;
      --horizon-end: #00f2fe;
      --horizon-shadow: 0 -2px 14px 2px rgba(0, 242, 254, 0.7), 0 -4px 28px 6px rgba(139, 92, 246, 0.5);

      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="cyan"] {
      --bg-deep: #040914;
      --bg-nebula: radial-gradient(circle at 50% 25%, rgba(2, 132, 199, 0.35) 0%, rgba(0, 242, 254, 0.16) 45%, rgba(4, 9, 20, 0.98) 82%);
      --bg-surface: rgba(10, 24, 42, 0.85);
      --bg-surface-elevated: rgba(14, 34, 58, 0.82);
      --border-active: rgba(0, 242, 254, 0.6);
      --accent-cyan: #00f2fe;
      --accent-purple: #0284c7;
      --accent-magenta: #f59e0b;
      --accent-lavender: #7dd3fc;
      --hero-btn: linear-gradient(135deg, #0284c7 0%, #00f2fe 100%);
      --hero-shadow: 0 4px 20px rgba(2, 132, 199, 0.55), 0 0 16px rgba(0, 242, 254, 0.45);
      --kbd-border: rgba(0, 242, 254, 0.65);
      --kbd-color: #00f2fe;
      --horizon-start: #f59e0b;
      --horizon-mid: #0284c7;
      --horizon-end: #00f2fe;
      --horizon-shadow: 0 -2px 14px 2px rgba(0, 242, 254, 0.7), 0 -4px 26px 5px rgba(2, 132, 199, 0.45);
    }

    [data-theme="violet"] {
      --bg-deep: #080616;
      --bg-nebula: radial-gradient(circle at 50% 25%, rgba(139, 92, 246, 0.4) 0%, rgba(192, 132, 252, 0.15) 45%, rgba(8, 6, 22, 0.98) 82%);
      --bg-surface: rgba(22, 16, 44, 0.85);
      --bg-surface-elevated: rgba(32, 24, 62, 0.82);
      --border-active: rgba(192, 132, 252, 0.6);
      --accent-cyan: #c084fc;
      --accent-purple: #a855f7;
      --accent-magenta: #ec4899;
      --accent-lavender: #f0abfc;
      --hero-btn: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%);
      --hero-shadow: 0 4px 20px rgba(124, 58, 237, 0.55), 0 0 16px rgba(192, 132, 252, 0.45);
      --kbd-border: rgba(192, 132, 252, 0.6);
      --kbd-color: #f0abfc;
      --horizon-start: #ec4899;
      --horizon-mid: #a855f7;
      --horizon-end: #c084fc;
      --horizon-shadow: 0 -2px 14px 2px rgba(192, 132, 252, 0.7), 0 -4px 28px 6px rgba(168, 85, 247, 0.5);
    }

    [data-theme="emerald"] {
      --bg-deep: #040e0b;
      --bg-nebula: radial-gradient(circle at 50% 25%, rgba(16, 185, 129, 0.35) 0%, rgba(52, 211, 153, 0.15) 45%, rgba(4, 14, 11, 0.98) 82%);
      --bg-surface: rgba(10, 30, 24, 0.85);
      --bg-surface-elevated: rgba(16, 44, 34, 0.82);
      --border-active: rgba(52, 211, 153, 0.6);
      --accent-cyan: #34d399;
      --accent-purple: #10b981;
      --accent-magenta: #06b6d4;
      --accent-lavender: #a7f3d0;
      --hero-btn: linear-gradient(135deg, #059669 0%, #34d399 100%);
      --hero-shadow: 0 4px 20px rgba(5, 150, 105, 0.55), 0 0 16px rgba(52, 211, 153, 0.45);
      --kbd-border: rgba(52, 211, 153, 0.6);
      --kbd-color: #6ee7b7;
      --horizon-start: #10b981;
      --horizon-mid: #34d399;
      --horizon-end: #6ee7b7;
      --horizon-shadow: 0 -2px 14px 2px rgba(52, 211, 153, 0.7), 0 -4px 28px 6px rgba(16, 185, 129, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-deep);
      background-image: var(--bg-nebula);
      background-attachment: fixed;
      font-family: var(--font-sans);
      color: var(--text-primary);
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #float-widget {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Bottom Horizon Flare (Image 4) */
    .horizon-flare {
      position: absolute;
      bottom: 0;
      left: 6%;
      right: 6%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--horizon-start) 20%, var(--horizon-mid) 50%, var(--horizon-end) 80%, transparent 100%);
      box-shadow: var(--horizon-shadow);
      border-radius: 50%;
      pointer-events: none;
      z-index: 20;
    }

    /* Header */
    .float-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: rgba(16, 19, 38, 0.75);
      border-bottom: 1px solid var(--border-subtle);
      gap: 6px;
      -webkit-app-region: drag;
    }

    .float-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .float-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
      box-shadow: 0 0 8px var(--accent-cyan);
      flex-shrink: 0;
    }

    .float-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .float-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
    }

    .float-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-active);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .float-btn.active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.4) 0%, rgba(6, 182, 212, 0.3) 100%);
      border-color: var(--accent-cyan);
      color: #ffffff;
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
    }

    /* Main Body Area */
    .float-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px 10px;
      gap: 6px;
      text-align: center;
      position: relative;
    }

    .float-tag {
      font-size: 10px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 2px 10px;
      border-radius: 12px;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Dial Display (Image 1 & 2) */
    .float-dial-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .float-dial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .float-dial-ticks {
      stroke: rgba(255, 255, 255, 0.15);
    }

    .float-dial-track {
      stroke: rgba(255, 255, 255, 0.06);
    }

    .float-dial-progress {
      stroke-dasharray: 439.82; /* 2 * PI * 70 */
      stroke-dashoffset: 439.82;
      transition: stroke-dashoffset 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .float-dial-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .float-mode-badge {
      font-size: 9px;
      color: var(--accent-cyan);
      letter-spacing: 0.6px;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 8px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .float-clock {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(0, 242, 254, 0.35);
      line-height: 1.1;
    }

    .float-clock small {
      font-size: 15px;
      color: var(--accent-cyan);
      margin-left: 2px;
    }

    .float-clock.warning {
      color: #f43f5e;
      text-shadow: 0 0 16px rgba(244, 63, 94, 0.6);
    }

    /* Sub-Gauges (Image 1) */
    .float-sub-gauges {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .float-sub-gauge {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px 5px;
      min-width: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .float-sub-val {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .float-sub-lbl {
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--text-muted);
    }

    /* Dual Clocks View */
    .float-dual-box {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 8px 12px;
    }

    .float-dual-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .float-dual-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
    }

    .float-dual-digits {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .float-dual-digits.warning {
      color: #f43f5e;
    }

    /* Controls Row */
    .float-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 4px;
    }

    .float-ctrl-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .float-ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-active);
      transform: translateY(-1px);
    }

    .float-ctrl-primary {
      flex: 1.3;
      background: var(--hero-btn);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 12px;
      box-shadow: var(--hero-shadow);
      font-size: 12px;
      font-weight: 800;
    }

    .float-ctrl-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 26px rgba(124, 58, 237, 0.7), 0 0 18px rgba(0, 242, 254, 0.5);
    }

    .float-ctrl-primary.running {
      background: linear-gradient(135deg, #e11d48 0%, #f43f5e 100%);
      box-shadow: 0 4px 20px rgba(225, 29, 72, 0.6);
    }

    /* Shortcut Keycaps */
    kbd.float-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 16px;
      padding: 0 4px;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 800;
      color: var(--kbd-color);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--kbd-border);
      border-radius: 4px;
      box-shadow: 0 0 6px rgba(0, 242, 254, 0.25);
    }

    .float-ctrl-primary kbd.float-key {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.25);
    }

    /* Always on top tip banner */
    .float-ontop-banner {
      background: rgba(6, 182, 212, 0.1);
      border-top: 1px solid rgba(6, 182, 212, 0.25);
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #bae6fd;
    }

    .float-ontop-banner button {
      background: linear-gradient(135deg, #7c3aed 0%, #00f2fe 100%);
      color: #ffffff;
      border: none;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* COMPACT SIZE MODE */
    body[data-size="compact"] .float-tag,
    body[data-size="compact"] .float-sub-gauges,
    body[data-size="compact"] .float-ontop-banner {
      display: none;
    }

    body[data-size="compact"] .float-dial-wrapper {
      width: 130px;
      height: 130px;
    }

    body[data-size="compact"] .float-clock {
      font-size: 20px;
    }

    body[data-size="compact"] .float-clock small {
      font-size: 12px;
    }

    body[data-size="compact"] .float-ctrl-btn {
      padding: 4px 8px;
      font-size: 10px;
    }

    /* MINI SIZE MODE */
    body[data-size="mini"] .float-tag,
    body[data-size="mini"] .float-sub-gauges,
    body[data-size="mini"] .float-mode-badge,
    body[data-size="mini"] .float-ontop-banner,
    body[data-size="mini"] .float-dial-svg {
      display: none;
    }

    body[data-size="mini"] .float-header {
      padding: 3px 6px;
    }

    body[data-size="mini"] .float-dial-wrapper {
      width: auto;
      height: auto;
    }

    body[data-size="mini"] .float-clock {
      font-size: 18px;
    }

    body[data-size="mini"] .float-ctrl-btn {
      padding: 2px 6px;
      font-size: 9px;
    }
  </style>
</head>
<body data-size="normal">
  <div id="float-widget">
    <!-- Ambient Horizon Light Flare -->
    <div class="horizon-flare" aria-hidden="true"></div>

    <!-- Header -->
    <div class="float-header">
      <div class="float-title">
        <span class="float-icon"></span>
        <span>AlgoTimer</span>
      </div>
      <div class="float-actions">
        <!-- Quick Theme Cycler Button -->
        <button class="float-btn" id="btn-float-theme" title="Switch Dynamic Color Palette">
          🎨 <span id="float-theme-label">Cosmic</span>
        </button>

        <!-- Always on Top PiP -->
        <button class="float-btn" id="btn-pip-always-ontop" title="Pin Always-On-Top over VS Code & other apps">
          📌 <span id="btn-pip-text">Always on Top</span>
        </button>

        <!-- Corner cycler -->
        <button class="float-btn" id="btn-corner-cycle" title="Dock window to screen corners (Top-Right, Bottom-Right, Bottom-Left, Top-Left)">
          <span id="corner-label">↗ TR</span>
        </button>

        <!-- Size toggle -->
        <button class="float-btn" id="btn-size-cycle" title="Resize window (Normal -> Compact -> Mini)">
          🗜️ <span id="size-label">Size</span>
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="float-body">
      <div class="float-tag" id="float-problem-title">Problem Solving Session</div>

      <!-- Single Clock Dial View (Stopwatch or Target Timer) -->
      <div id="float-single-view">
        <div class="float-dial-wrapper">
          <svg class="float-dial-svg" viewBox="0 0 160 160">
            <defs>
              <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f2fe" id="grad-stop-1" />
                <stop offset="50%" stop-color="#8b5cf6" id="grad-stop-2" />
                <stop offset="100%" stop-color="#ec4899" id="grad-stop-3" />
              </linearGradient>
              <filter id="timerGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <!-- Outer Precision Ticks (Cyan & Violet Dotted Track) -->
            <circle class="float-dial-ticks" cx="80" cy="80" r="74" stroke="rgba(255, 255, 255, 0.16)" stroke-dasharray="2 5" stroke-width="2" fill="none" />
            <!-- Base Track -->
            <circle class="float-dial-track" cx="80" cy="80" r="70" stroke="rgba(255, 255, 255, 0.06)" stroke-width="6" fill="none"></circle>
            <!-- Active Progress Arc -->
            <circle class="float-dial-progress" id="float-dial-progress" cx="80" cy="80" r="70" stroke="url(#timerGrad)" filter="url(#timerGlow)" stroke-width="6" stroke-linecap="round" fill="none"></circle>
          </svg>

          <div class="float-dial-content">
            <div class="float-mode-badge" id="float-mode-badge">STOPWATCH</div>
            <div class="float-clock" id="float-clock-single">00:00<small id="float-millis">.0</small></div>

            <!-- 3 Mini Sub-Gauges (Image 1) -->
            <div class="float-sub-gauges">
              <div class="float-sub-gauge" title="Total Laps">
                <span class="float-sub-val" id="float-sub-laps">0</span>
                <span class="float-sub-lbl">LAPS</span>
              </div>
              <div class="float-sub-gauge" title="Current Split">
                <span class="float-sub-val" id="float-sub-split">00:00</span>
                <span class="float-sub-lbl">SPLIT</span>
              </div>
              <div class="float-sub-gauge" title="Timer Status">
                <span class="float-sub-val" id="float-sub-state">READY</span>
                <span class="float-sub-lbl">STATUS</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Dual Clocks View (Both Active) -->
      <div class="float-dual-box" id="float-clock-dual" style="display: none;">
        <div class="float-dual-row">
          <span class="float-dual-label">⏱️ Elapsed</span>
          <span class="float-dual-digits" id="float-dual-sw">00:00:00</span>
        </div>
        <div class="float-dual-row">
          <span class="float-dual-label">⏳ Target</span>
          <span class="float-dual-digits" id="float-dual-timer">30:00:00</span>
        </div>
      </div>

      <!-- Controls with Shortcut Keycaps -->
      <div class="float-controls">
        <button class="float-ctrl-btn float-ctrl-primary" id="btn-play">
          ▶ <span id="btn-play-text">Start</span> <kbd class="float-key">Space</kbd>
        </button>
        <button class="float-ctrl-btn" id="btn-lap">
          Lap <kbd class="float-key">L</kbd>
        </button>
        <button class="float-ctrl-btn" id="btn-reset">
          ↺ <kbd class="float-key">R</kbd>
        </button>
      </div>
    </div>

    <!-- Banner -->
    <div class="float-ontop-banner" id="banner-pip-tip">
      <span>Float over VS Code, Discord, & all desktop apps</span>
      <button id="btn-banner-pip">📌 Pop Over Apps</button>
    </div>
  </div>

  <script src="popup/audio.js"></script>
  <script src="float.js"></script>
</body>
</html>
